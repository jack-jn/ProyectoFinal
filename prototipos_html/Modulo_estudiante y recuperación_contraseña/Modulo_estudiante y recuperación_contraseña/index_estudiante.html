<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal del Estudiante | Academia de Música Dunamys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#CE2127; --red-dark:#A9171D; --red-soft:#FCEBEC; --red-border:#F6C6C8; --red-on-dark:#FF6B70;
  --ink:#191718; --ink-2:#2B2729; --ink-3:#443F42;
  --muted:#6B6568; --line:#E7E3E4; --bg:#F4F2F3; --surface:#FAF9F9; --white:#fff;
  --green:#168854; --green-dark:#0F683F; --green-soft:#E3F6ED; --green-border:#B4E6CE;
  --gold:#D9900D; --gold-dark:#855400; --gold-soft:#FEF3DC; --gold-border:#F7D794;
  --blue:#2563EB; --blue-dark:#1D4ED8; --blue-soft:#EFF6FF; --blue-border:#BFDBFE;
  --shadow-sm:0 2px 8px rgba(25,23,24,.04);
  --shadow-md:0 10px 28px rgba(25,23,24,.08);
  --shadow-lg:0 24px 60px rgba(25,23,24,.24);
  --font-display:'Sora','Figtree',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font-body)}
body.no-scroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
:focus-visible{outline:3px solid rgba(206,33,39,.4);outline-offset:2px}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Layout Principal ---------- */
.app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
.sidebar{background:var(--ink);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 16px 18px;z-index:40}
.scrim{display:none}
.main{padding:26px 36px 48px;min-width:0;max-width:1580px;width:100%}

/* ---------- Barra Lateral ---------- */
.brand{background:#fff;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;min-height:60px}
.brand-mark{width:38px;height:38px;flex:none}
.brand-name{font:700 20px/1 var(--font-display);color:var(--ink);letter-spacing:-.02em}
.user{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 0 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.avatar{width:64px;height:64px;border-radius:50%;border:2px solid var(--red);display:grid;place-items:center;background:var(--ink-2);color:#fff;font:700 22px/1 var(--font-display)}
.user small{margin-top:10px;font-size:12px;letter-spacing:.06em;color:#BDB6B9}
.user strong{font:700 16px/1.3 var(--font-display);color:var(--red-on-dark)}
.nav{display:flex;flex-direction:column;gap:6px;padding:18px 0;flex:1}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-radius:12px;background:transparent;color:#D3CDCF;text-align:left;font-weight:500;line-height:1.25;transition:.16s}
.nav-item .i{width:20px;height:20px}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.is-active{background:var(--red);color:#fff;font-weight:600;box-shadow:0 6px 18px rgba(206,33,39,.35)}
.nav-item .chev{margin-left:auto;width:16px;height:16px}
.sidebar-foot{border-top:1px solid rgba(255,255,255,.1);padding-top:14px;text-align:center;font:600 13px/1.4 var(--font-body);margin-bottom:12px}
.sidebar-foot span{display:block;color:var(--red-on-dark)}
.sidebar-logout{
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06);
  color:#EDEAEB;
  border-radius:10px;
  padding:9px 12px;
  font-size:13px;
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:.15s;
}
.sidebar-logout:hover{
  background:rgba(206,33,39,.25);
  border-color:var(--red-on-dark);
  color:#fff;
}

/* ---------- Encabezados (Títulos ~26px según especificación) ---------- */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{margin:0;font:700 26px/1.2 var(--font-display);letter-spacing:-.02em}
.page-head h1 span{color:var(--red)}
.page-head p{margin:5px 0 0;color:var(--muted);font-size:14px}
.head-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn.menu-btn{display:none}

.course-chip{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 14px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  font-size:13px;
  font-weight:600;
  color:var(--ink);
  box-shadow:var(--shadow-sm);
}
.course-chip__dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--red);
}

/* ---------- Botones y Controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-weight:600;font-size:13.5px;white-space:nowrap;transition:all .16s;text-decoration:none}
.btn .i{width:16px;height:16px}
.btn:disabled{opacity:.48;cursor:not-allowed;transform:none !important}
.btn--primary{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(206,33,39,.22)}
.btn--primary:hover:not(:disabled){background:var(--red-dark);transform:translateY(-1px)}
.btn--dark{background:var(--ink);color:#fff}
.btn--dark:hover:not(:disabled){background:#000;transform:translateY(-1px)}
.btn--green{background:var(--green);color:#fff;box-shadow:0 4px 12px rgba(22,136,84,.22)}
.btn--green:hover:not(:disabled){background:var(--green-dark);transform:translateY(-1px)}
.btn--outline{background:#fff;border-color:#D4CFD1;color:var(--ink)}
.btn--outline:hover:not(:disabled){border-color:var(--ink);background:var(--surface)}
.btn--ghost{background:#EFEBEC;color:var(--ink)}
.btn--ghost:hover:not(:disabled){background:#E2DCDD}
.btn--soft-red{background:var(--red-soft);color:var(--red-dark);border-color:var(--red-border)}
.btn--soft-red:hover:not(:disabled){background:#F9D7D9}
.btn--sm{height:34px;padding:0 12px;font-size:12.5px;border-radius:8px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid #D4CFD1;background:#fff;white-space:nowrap}
.pill.green{background:var(--green-soft);border-color:var(--green-border);color:var(--green-dark)}
.pill.gold{background:var(--gold-soft);border-color:var(--gold-border);color:var(--gold-dark)}
.pill.red{background:var(--red-soft);border-color:var(--red-border);color:var(--red-dark)}
.pill.blue{background:var(--blue-soft);border-color:var(--blue-border);color:var(--blue-dark)}
.pill.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.pill.neutral{background:#EFEBEC;border-color:#DDD8DA;color:var(--muted)}

/* ---------- Layout Maestro-Detalle ---------- */
.est-master-detail{
  display:grid;
  grid-template-columns:320px minmax(0,1fr);
  gap:22px;
  align-items:start;
}

/* Columna Izquierda: Lista de Sesiones / Tareas */
.est-side-list{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  box-shadow:var(--shadow-sm);
  display:flex;
  flex-direction:column;
  gap:10px;
  position:sticky;
  top:20px;
  max-height:calc(100vh - 40px);
  overflow-y:auto;
}
.est-side-list__head{
  padding:4px 6px 12px;
  border-bottom:1px solid var(--line);
  margin-bottom:4px;
}
.est-side-list__head h2{
  margin:0;
  font:700 17px/1.2 var(--font-display);
  color:var(--ink);
}
.est-side-list__head p{
  margin:3px 0 0;
  font-size:12px;
  color:var(--muted);
}

.est-item-card{
  background:var(--surface);
  border:1.5px solid var(--line);
  border-radius:13px;
  padding:12px 14px;
  text-align:left;
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  transition:all .16s;
  cursor:pointer;
  position:relative;
}
.est-item-card:hover{
  background:#fff;
  border-color:#CFC8CB;
  transform:translateY(-1px);
  box-shadow:var(--shadow-sm);
}
.est-item-card.is-active{
  border-color:var(--red);
  background:linear-gradient(180deg,#FFF9F9 0%,#FFFFFF 100%);
  box-shadow:0 6px 16px rgba(206,33,39,.12);
}
.est-item-card.is-active::before{
  content:"";
  position:absolute;
  left:0;
  top:12px;
  bottom:12px;
  width:4px;
  border-radius:0 4px 4px 0;
  background:var(--red);
}
.est-item-card.is-locked{
  opacity:.65;
  background:#F2EFF0;
}
.est-item-card__badge{
  width:36px;
  height:36px;
  border-radius:10px;
  background:#EAE6E7;
  color:var(--ink);
  font:700 13px/1 var(--font-display);
  display:grid;
  place-items:center;
  flex:none;
}
.est-item-card.is-active .est-item-card__badge{
  background:var(--red);
  color:#fff;
}
.est-item-card__info{
  min-width:0;
  flex:1;
}
.est-item-card__top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  margin-bottom:2px;
}
.est-item-card__num{
  font-size:11.5px;
  font-weight:700;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.04em;
}
.est-item-card__title{
  font:700 14px/1.3 var(--font-display);
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  display:block;
}
.est-item-card__status{
  margin-left:auto;
  flex:none;
}

/* Columna Derecha: Detalle de Sesión / Tarea */
.est-detail-panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow-sm);
  overflow:hidden;
}
.est-detail-hero{
  padding:24px 28px;
  background:linear-gradient(180deg,#FFFFFF 0%,#FAF8F9 100%);
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
  flex-wrap:wrap;
}
.est-detail-hero__main h2{
  margin:4px 0 6px;
  font:700 22px/1.25 var(--font-display);
  color:var(--ink);
}
.est-detail-hero__meta{
  font-size:12.5px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.est-detail-body{
  padding:26px 28px;
}

.est-desc-box{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px 18px;
  font-size:14px;
  line-height:1.6;
  color:var(--ink-2);
  margin-bottom:26px;
}

/* Lista de Materiales / Lecciones */
.est-section-title{
  margin:0 0 16px;
  font:700 17px/1.2 var(--font-display);
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.est-materials-grid{
  display:grid;
  gap:14px;
}
.est-material-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px 18px;
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:16px;
  align-items:center;
  transition:all .16s;
  box-shadow:0 2px 6px rgba(25,23,24,.02);
}
.est-material-card:hover{
  border-color:#CFC8CB;
  box-shadow:var(--shadow-sm);
}
.est-mat-icon{
  width:44px;
  height:44px;
  border-radius:12px;
  display:grid;
  place-items:center;
  font-size:18px;
  flex:none;
}
.est-mat-icon.video{background:var(--red-soft);color:var(--red)}
.est-mat-icon.pdf{background:var(--blue-soft);color:var(--blue-dark)}
.est-mat-icon.partitura{background:var(--gold-soft);color:var(--gold-dark)}

.est-mat-info strong{
  display:block;
  font:700 15px/1.3 var(--font-display);
  color:var(--ink);
  margin-bottom:3px;
}
.est-mat-info p{
  margin:0 0 6px;
  font-size:13px;
  color:var(--ink-3);
  line-height:1.45;
}
.est-mat-meta{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:12px;
  color:var(--muted);
  flex-wrap:wrap;
}
.est-mat-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

/* Tarjetas de Lección en Detalle de Sesión */
.est-lesson-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px 18px;
  display:flex;
  flex-direction:column;
  gap:14px;
  transition:all .16s;
  box-shadow:0 2px 6px rgba(25,23,24,.02);
}
.est-lesson-card:hover{
  border-color:#CFC8CB;
  box-shadow:var(--shadow-sm);
}
.est-lesson-card__head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
  flex-wrap:wrap;
}
.est-lesson-card__num{
  font:700 15px/1.3 var(--font-display);
  color:var(--ink);
  letter-spacing:-.01em;
}
.est-lesson-card__meta{
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.est-lesson-card__dur{
  font-size:12px;
  font-weight:600;
  color:var(--muted);
}
.est-lesson-card__body{
  display:grid;
  grid-template-columns:240px 1fr;
  gap:20px;
  align-items:start;
}
.est-lesson-card__media{
  width:240px;
  flex:none;
}
.est-lesson-card__media .est-video-player{
  width:100%;
  aspect-ratio:16/9;
  max-height:140px;
}
.est-lesson-doc-thumb{
  width:100%;
  aspect-ratio:16/9;
  max-height:140px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:pointer;
  transition:all .16s;
}
.est-lesson-doc-thumb:hover{
  background:#fff;
  border-color:var(--red-border);
  box-shadow:var(--shadow-sm);
}
.est-lesson-doc-thumb:focus-visible{
  outline:3px solid var(--red);
  outline-offset:2px;
}
.est-lesson-card__content{
  display:flex;
  flex-direction:column;
  gap:8px;
  min-width:0;
}
.est-lesson-field{
  display:flex;
  flex-direction:column;
  gap:2px;
}
.est-lesson-label{
  font-size:11px;
  font-weight:700;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.04em;
}
.est-lesson-title{
  font:700 14.5px/1.35 var(--font-display);
  color:var(--ink);
  word-break:break-word;
}
.est-lesson-desc{
  margin:0;
  font-size:13px;
  line-height:1.5;
  color:var(--ink-2);
  word-break:break-word;
}
.est-lesson-file{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
  word-break:break-all;
}
.est-lesson-card__content .est-mat-actions{
  margin-top:6px;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
@media (max-width:720px){
  .est-lesson-card__body{
    grid-template-columns:1fr;
    gap:14px;
  }
  .est-lesson-card__media{
    width:100%;
  }
  .est-lesson-card__media .est-video-player,
  .est-lesson-doc-thumb{
    max-height:220px;
  }
}
@media (max-width:480px){
  .est-lesson-card{
    padding:14px 14px;
  }
}

/* ===================================================================
   BARRA DE PROGRESO DEL ESTUDIANTE (CAMBIO 2)
   =================================================================== */
.est-course-progress{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px 18px;
  margin-bottom:22px;
  box-shadow:var(--shadow-sm);
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:8px;
  max-height:60px;
}
.est-course-progress__info{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  font-size:13px;
  font-weight:600;
  color:var(--ink-2);
  line-height:1.2;
}
.est-course-progress__text{
  display:inline-flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.est-course-progress__percent{
  font-weight:700;
  font-size:13px;
  color:var(--ink);
  font-feature-settings:"tnum";
  flex:none;
}
.est-course-progress__track{
  width:100%;
  height:7px;
  background:#EAE6E7;
  border-radius:999px;
  overflow:hidden;
}
.est-course-progress__fill{
  height:100%;
  border-radius:999px;
  background:var(--red);
  width:0%;
  transition:width .6s cubic-bezier(0.4, 0, 0.2, 1), background-color .4s ease;
}
.est-course-progress.is-completed .est-course-progress__fill{
  background:var(--green);
}
.est-course-progress.is-completed .est-course-progress__percent{
  color:var(--green-dark);
}
@media (prefers-reduced-motion: reduce){
  .est-course-progress__fill{
    transition:none !important;
  }
}

/* ===================================================================
   REPRODUCTOR DE VIDEO Y MINIATURAS (CAMBIOS 1 Y 3)
   =================================================================== */
.est-material-card--video{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:14px;
  padding:16px 18px;
}
.est-material-card__body{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  width:100%;
}
.est-material-card__body .est-mat-info{
  min-width:0;
  flex:1 1 280px;
}
.est-material-card__body .est-mat-actions{
  flex:none;
}

.est-video-player{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  max-height:260px;
  background:linear-gradient(135deg, #181516 0%, #0d0c0c 50%, #1c1819 100%);
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
}
.est-video-player:focus-visible{
  outline:3px solid var(--red);
  outline-offset:2px;
}
.est-video-player__media{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  pointer-events:none;
}
.est-video-player__scrim{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.25);
  transition:background .2s;
  pointer-events:none;
}
.est-video-player:hover .est-video-player__scrim{
  background:rgba(0,0,0,.12);
}
.est-video-player__play{
  position:relative;
  z-index:2;
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--red);
  color:#fff;
  display:grid;
  place-items:center;
  box-shadow:0 6px 20px rgba(206,33,39,.45);
  transition:transform .18s cubic-bezier(.16,1,.3,1), background-color .16s;
  pointer-events:none;
}
.est-video-player:hover .est-video-player__play{
  transform:scale(1.08);
  background:var(--red-dark);
}
.est-video-player__play-tri{
  width:22px;
  height:22px;
  margin-left:3px;
  fill:#fff;
}
.est-video-player__duration{
  position:absolute;
  right:12px;
  bottom:14px;
  z-index:3;
  background:rgba(0,0,0,.75);
  color:#fff;
  font-size:11.5px;
  font-weight:600;
  padding:3px 7px;
  border-radius:6px;
  letter-spacing:.03em;
  backdrop-filter:blur(4px);
  pointer-events:none;
}
.est-video-player__timeline{
  position:absolute;
  left:14px;
  right:14px;
  bottom:8px;
  height:3px;
  background:rgba(255,255,255,.24);
  border-radius:999px;
  z-index:2;
  pointer-events:none;
}
.est-video-player__timeline-bar{
  height:100%;
  width:32%;
  background:#fff;
  border-radius:999px;
}
.est-modal-video-wrap{
  position:relative;
  background:#000;
  border-radius:14px;
  overflow:hidden;
  margin-bottom:16px;
  aspect-ratio:16/9;
  max-height:360px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.est-modal-video{
  width:100%;
  height:100%;
  max-height:360px;
  object-fit:contain;
  background:#000;
}
.est-video-fallback{
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,#181516 0%,#0d0c0c 50%,#1c1819 100%);
  color:#fff;
  padding:24px;
  text-align:center;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

@media (max-width:480px){
  .est-course-progress{padding:10px 14px;margin-bottom:16px}
  .est-course-progress__info{font-size:11.5px}
  .est-detail-hero, .est-detail-body{padding:16px 14px}
  .est-material-card--video{padding:12px 14px}
  .est-video-player{max-height:200px}
  .est-video-player__play{width:48px;height:48px}
  .est-video-player__play-tri{width:18px;height:18px}
}

/* Panel de Sesión Bloqueada / Sin Autorización */
.est-state-panel{
  padding:60px 24px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.est-state-icon{
  width:64px;
  height:64px;
  border-radius:18px;
  display:grid;
  place-items:center;
  margin-bottom:18px;
}
.est-state-icon.lock{background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.est-state-icon.danger{background:var(--red-soft);color:var(--red)}
.est-state-panel h3{
  margin:0 0 8px;
  font:700 20px/1.3 var(--font-display);
  color:var(--ink);
}
.est-state-panel p{
  margin:0 0 20px;
  max-width:440px;
  color:var(--muted);
  font-size:14px;
  line-height:1.55;
}

/* ===================================================================
   VISTA DE DETALLE DE TAREA Y ZONA DE SUBIDA
   =================================================================== */
.est-task-consigna{
  background:linear-gradient(135deg,#FFFDFD 0%,#FAF7F8 100%);
  border:1px solid var(--red-border);
  border-left:5px solid var(--red);
  border-radius:14px;
  padding:20px 22px;
  margin-bottom:24px;
}
.est-task-consigna__head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
  flex-wrap:wrap;
}
.est-deadline-badge{
  font-size:12.5px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:var(--red-dark);
}
.est-deadline-badge.ontime{color:var(--ink-2)}

.est-upload-area{
  border:2px dashed #CFC9CB;
  border-radius:14px;
  background:var(--surface);
  padding:26px 20px;
  text-align:center;
  cursor:pointer;
  transition:all .18s;
  margin-top:14px;
}
.est-upload-area:hover, .est-upload-area.is-dragover{
  border-color:var(--red);
  background:var(--red-soft);
}
.est-upload-area__icon{
  width:46px;
  height:46px;
  border-radius:12px;
  background:#fff;
  color:var(--red);
  display:grid;
  place-items:center;
  margin:0 auto 10px;
  box-shadow:var(--shadow-sm);
}
.est-upload-area strong{
  display:block;
  font-size:14.5px;
  color:var(--ink);
  margin-bottom:4px;
}
.est-upload-area small{
  display:block;
  font-size:12px;
  color:var(--muted);
}

.est-files-staged{
  margin-top:18px;
  display:grid;
  gap:8px;
}
.est-staged-file{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 14px;
  font-size:13px;
}
.est-staged-file strong{
  font-weight:600;
  color:var(--ink);
}
.est-staged-file span{
  color:var(--muted);
  font-size:12px;
}
.est-remove-file-btn{
  border:0;
  background:none;
  color:var(--muted);
  width:26px;
  height:26px;
  border-radius:6px;
  display:grid;
  place-items:center;
  padding:0;
  transition:.15s;
}
.est-remove-file-btn:hover{
  background:var(--red-soft);
  color:var(--red);
}

/* Apartado O pega un enlace */
.est-link-section{
  margin-top:16px;
  padding-top:14px;
  border-top:1px dashed var(--line);
}
.est-link-section-title{
  font-size:13px;
  font-weight:600;
  color:var(--ink-2);
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:6px;
}
.est-link-input-group{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}
.est-link-input{
  flex:1 1 200px;
  height:38px;
  padding:0 12px;
  border:1.5px solid var(--line);
  border-radius:8px;
  background:#fff;
  font-size:13.5px;
  color:var(--ink);
  transition:border-color .15s;
}
.est-link-input:focus{
  outline:none;
  border-color:var(--red);
  box-shadow:0 0 0 3px rgba(206,33,39,.12);
}
.est-input-error{
  color:var(--red-dark);
  font-size:12.5px;
  font-weight:500;
  margin-top:6px;
  display:none;
}
.est-error{
  color:var(--red-dark);
  font-size:13px;
  font-weight:500;
  background:var(--red-soft);
  border:1px solid var(--red-border);
  border-radius:8px;
  padding:8px 12px;
  display:none;
}

.est-task-actions-row{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:12px;
  margin-top:20px;
  padding-top:16px;
  border-top:1px solid var(--line);
  flex-wrap:wrap;
}

/* ===================================================================
   PANTALLA DEDICADA "VER DETALLES" (#/tarea/ID/detalle)
   =================================================================== */
.est-full-detail{
  display:flex;
  flex-direction:column;
  gap:22px;
}
.est-detail-backbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--ink);
  color:#fff;
  padding:14px 20px;
  border-radius:14px;
  flex-wrap:wrap;
  gap:12px;
}
.est-detail-backbar a{
  color:#fff;
  text-decoration:none;
  font-weight:600;
  font-size:13.5px;
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.est-detail-backbar a:hover{
  color:var(--red-on-dark);
}

.est-stats-grid{
  display:grid;
  grid-template-columns:repeat(3, minmax(0,1fr));
  gap:16px;
}
.est-stat-box{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px 18px;
  box-shadow:var(--shadow-sm);
}
.est-stat-box small{
  display:block;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:var(--muted);
  margin-bottom:6px;
}
.est-stat-box strong{
  font:700 18px/1.2 var(--font-display);
  color:var(--ink);
}
.est-stat-box.highlight small{
  color:var(--red);
}

/* Línea de Progreso de Estado */
.est-progress-box{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px 24px;
  box-shadow:var(--shadow-sm);
}
.est-progress-box h3{
  margin:0 0 16px;
  font:700 15px/1.2 var(--font-display);
  color:var(--ink);
}
.est-stepper{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  position:relative;
  gap:10px;
}
.est-stepper::before{
  content:"";
  position:absolute;
  top:18px;
  left:15%;
  right:15%;
  height:3px;
  background:#EAE6E7;
  z-index:1;
}
.est-step-node{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  position:relative;
  z-index:2;
}
.est-step-circle{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#fff;
  border:2px solid #D4CFD1;
  color:var(--muted);
  display:grid;
  place-items:center;
  font-weight:700;
  font-size:13px;
  margin-bottom:8px;
  transition:all .2s;
}
.est-step-label{
  font-size:12.5px;
  font-weight:600;
  color:var(--muted);
}
.est-step-node.completed .est-step-circle{
  background:var(--green);
  border-color:var(--green-dark);
  color:#fff;
}
.est-step-node.completed .est-step-label{
  color:var(--green-dark);
  font-weight:700;
}
.est-step-node.observed .est-step-circle{
  background:var(--red);
  border-color:var(--red-dark);
  color:#fff;
}
.est-step-node.observed .est-step-label{
  color:var(--red-dark);
  font-weight:700;
}
.est-step-node.current .est-step-circle{
  border-color:var(--gold);
  color:var(--gold-dark);
  background:var(--gold-soft);
}

.est-detail-split{
  display:grid;
  grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);
  gap:20px;
  align-items:start;
}
.est-content-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:22px 24px;
  box-shadow:var(--shadow-sm);
}
.est-content-card h3{
  margin:0 0 14px;
  font:700 17px/1.2 var(--font-display);
  color:var(--ink);
  display:flex;
  align-items:center;
  gap:8px;
}

/* Retroalimentación docente */
.est-feedback-card{
  background:linear-gradient(180deg,#FFFFFF 0%,#FBF9FA 100%);
  border:1px solid var(--line);
  border-radius:16px;
  padding:22px 24px;
  box-shadow:var(--shadow-sm);
}
.est-teacher-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
}
.est-teacher-avatar{
  width:42px;
  height:42px;
  border-radius:12px;
  background:var(--red-soft);
  color:var(--red-dark);
  font:700 15px/1 var(--font-display);
  display:grid;
  place-items:center;
}
.est-teacher-header strong{
  display:block;
  font:700 15px/1.2 var(--font-display);
  color:var(--ink);
}
.est-teacher-header small{
  color:var(--muted);
  font-size:12px;
}
.est-feedback-text{
  font-size:14px;
  line-height:1.6;
  color:var(--ink-2);
  margin:0;
  padding:14px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
}

/* Modales */
.overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(25,23,24,.65);
  backdrop-filter:blur(6px);
  z-index:60;
}
.overlay.is-open{display:flex}
.dialog{
  background:#fff;
  border-radius:20px;
  width:min(660px,100%);
  max-height:calc(100vh - 40px);
  overflow:auto;
  box-shadow:var(--shadow-lg);
  animation:pop .18s cubic-bezier(.16,1,.3,1);
}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.dialog__head{display:flex;align-items:center;gap:12px;padding:20px 24px 14px;border-bottom:1px solid var(--line)}
.dialog__title{margin:0;font:700 18px/1.2 var(--font-display);color:var(--ink)}
.dialog__close{margin-left:auto;border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.dialog__close:hover{background:var(--surface);color:var(--ink)}
.dialog__body{padding:20px 24px}
.dialog__foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px 20px;border-top:1px solid var(--line);background:var(--surface);border-radius:0 0 20px 20px}

/* Toasts */
.toasts{position:fixed;top:20px;right:20px;display:flex;flex-direction:column;gap:10px;z-index:90;pointer-events:none}
.toast{pointer-events:auto;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;width:min(390px,calc(100vw - 32px));background:#fff;border-radius:12px;padding:13px 14px;border-left:5px solid var(--green);box-shadow:0 12px 32px rgba(25,23,24,.22);animation:slide .2s ease-out}
.toast--error{border-color:var(--red)}
.toast--info{border-color:var(--ink)}
.toast p{margin:0;font-size:13.5px}
.toast__x{border:0;background:none;color:var(--muted);padding:2px 6px}
@keyframes slide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

/* Pantalla de Selección de Cursos */
.est-courses-section{
  margin-bottom:34px;
}
.est-group-title{
  font:700 18px/1.2 var(--font-display);
  color:var(--ink);
  margin:24px 0 14px;
  display:flex;
  align-items:center;
  gap:8px;
}
.est-group-count{
  font-size:13px;
  font-weight:600;
  color:var(--muted);
}
.est-courses-grid{
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  gap:20px;
}
.est-course-card{
  background:#fff;
  border:1px solid var(--line);
  border-top:4px solid var(--red);
  border-radius:16px;
  padding:20px 22px;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:var(--shadow-sm);
  transition:transform .16s, box-shadow .16s, border-color .16s;
  text-decoration:none;
  color:inherit;
  position:relative;
}
.est-course-card:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-md);
  border-color:#CFC8CB;
}
.est-course-card:focus-visible{
  outline:3px solid var(--red);
  outline-offset:2px;
}
.est-course-card--concluido{
  border-top-color:var(--green);
  background:linear-gradient(180deg,#FFFFFF 0%,#FAF9F9 100%);
}
.est-course-card__top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.est-course-card__code{
  font-size:12.5px;
  font-weight:700;
  color:var(--red);
  letter-spacing:.04em;
}
.est-course-card--concluido .est-course-card__code{
  color:var(--green-dark);
}
.est-course-card__title{
  margin:0;
  font:700 17px/1.25 var(--font-display);
  color:var(--ink);
}
.est-course-card__meta{
  font-size:12.5px;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  gap:4px;
}
.est-course-card__meta-item{
  display:flex;
  align-items:center;
  gap:6px;
}
.est-course-card__progress{
  margin-top:auto;
  padding-top:12px;
  border-top:1px solid var(--line);
  display:flex;
  flex-direction:column;
  gap:6px;
}
.est-course-card__progress-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  font-weight:600;
  color:var(--ink-2);
}
.est-course-card__progress-track{
  width:100%;
  height:6px;
  border-radius:999px;
  background:#EAE6E7;
  overflow:hidden;
}
.est-course-card__progress-fill{
  height:100%;
  border-radius:999px;
  background:var(--red);
}
.est-course-card--concluido .est-course-card__progress-fill{
  background:var(--green);
}

/* Responsive */
@media (max-width:1080px){
  .est-courses-grid{grid-template-columns:repeat(2, minmax(0, 1fr));}
  .est-master-detail{grid-template-columns:1fr}
  .est-side-list{position:static;max-height:none}
  .est-detail-split{grid-template-columns:1fr}
  .est-stats-grid{grid-template-columns:1fr}
}
@media (max-width:680px){
  .est-courses-grid{grid-template-columns:1fr;}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-102%);transition:transform .22s}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(25,23,24,.5);z-index:35}
  .btn.menu-btn{display:inline-flex}
  .main{padding:20px 16px 36px}
}

/* ===== Selección de cursos ===== */
.est-course-card{ text-align:left; font:inherit; cursor:pointer; width:100%; }
.est-course-card__cta{ font-weight:700; font-size:13.5px; color:var(--red); margin-top:2px; }
.est-course-card--concluido .est-course-card__cta{ color:var(--green-dark); }
.est-section-label{ font:700 15px/1.2 var(--font-display); color:var(--muted); margin:0 0 2px; }
.est-empty-courses{ padding:18px 20px; border:1px dashed var(--line); border-radius:14px; background:#fff; color:var(--muted); margin-top:12px; }
@media (max-width:1100px){ .est-courses-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:680px){ .est-courses-grid{ grid-template-columns:1fr; } }
</style>

<div class="app">
  <!-- ================= BARRA LATERAL ================= -->
  <aside class="sidebar" id="estSidebar">
    <div class="brand">

  // Cargar entregas de localStorage o inicializar con defaults
  function getEntregas() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY_ENTREGAS);
      if (raw) {
        const stored = JSON.parse(raw);
        let modified = false;
        // Asegurar que las entregas iniciales de demostración estén cargadas
        Object.keys(DEFAULT_ENTREGAS).forEach(k => {
          if (!stored[k]) {
            stored[k] = DEFAULT_ENTREGAS[k];
            modified = true;
          }
        });
        if (modified) {
          saveEntregas(stored);
        }
        return stored;
      }
    } catch (e) {
      console.warn('Error leyendo entregas guardadas:', e);
    }
    saveEntregas(DEFAULT_ENTREGAS);
    return { ...DEFAULT_ENTREGAS };
  }

  function saveEntregas(data) {
    try {
      localStorage.setItem(STORAGE_KEY_ENTREGAS, JSON.stringify(data));
    } catch (e) {
      console.error('Error persistiendo entregas:', e);
    }
  }

  // ===================================================================
  // 3. ESTADOS DE SESIÓN Y TAREA (RF038, RF040, RF041)
  // ===================================================================
  // Calcula el estado de cada sesión de un curso para el alumno
  function calculateSessionStates(course, entregas) {
    const states = {};
    const sesiones = course.sesiones;

    for (let i = 0; i < sesiones.length; i++) {
      const s = sesiones[i];
      const hasEntrega = !!entregas[s.id];

      if (hasEntrega) {
        states[s.id] = 'Completada';
      } else {
        if (i === 0) {
          states[s.id] = 'En proceso';
        } else {
          const prevSession = sesiones[i - 1];
          const prevDone = !!entregas[prevSession.id];
          states[s.id] = prevDone ? 'En proceso' : 'Bloqueada';
        }
      }
    }
    return states;
  }

  function updateCourseProgress() {
    const userCourse = getActiveCourse();
    if (!userCourse) return;
    const entregas = getEntregas();
    const m = userCourse.sesiones.length;
    let n = 0;
    userCourse.sesiones.forEach(s => {
      if (entregas[s.id]) n++;
    });

    const percent = m > 0 ? Math.round((n / m) * 100) : 0;
    const isCompleted = percent >= 100 && n === m;

    if (courseProgressWrap) {
      courseProgressWrap.classList.toggle('is-completed', isCompleted);
    }
    if (progressText) {
      if (m === 0) {
        progressText.textContent = 'Aún no hay sesiones';
      } else if (isCompleted) {
        progressText.textContent = 'Curso completado';
      } else {
        progressText.textContent = `Progreso del curso · ${n} de ${m} sesiones completadas`;
      }
    }
    if (progressText && m > 0 && isReadOnly()) {
      progressText.textContent = `Curso concluido · solo lectura · ${n} de ${m} sesiones completadas`;
    }
    if (progressPercent) {
      progressPercent.textContent = `${percent}%`;
    }
    if (progressBar) {
      progressBar.setAttribute('aria-valuenow', String(percent));
      progressBar.setAttribute('aria-label', m === 0 ? 'Aún no hay sesiones' : (isCompleted ? 'Curso completado' : `Progreso del curso: ${percent}%`));
    }
    if (progressFill) {
      progressFill.style.width = `${percent}%`;
    }
  }

  // Descarga real de archivos dummy con Blob (RF037)
  function triggerRealDownload(filename, textContent = '') {
    const dummyData = textContent || `Contenido de demostración de la Academia de Música Dunamys.\nArchivo: ${filename}\nFecha de generación: ${new Date().toLocaleString('es-PE')}\n`;
    const blob = new Blob([dummyData], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`Descargando "${filename}"...`, 'info');
  }

  const ACTIVE_COURSE_KEY = 'dunamys_curso_activo';
  const INSTRUMENT_ORDER = ['Teclado', 'Guitarra', 'Bajo'];

  function enrolledMats() {
    return MATRICULAS.filter(m => m.correo === CURRENT_STUDENT.correo);
  }
  function getActiveCourse() {
    const id = parseInt(sessionStorage.getItem(ACTIVE_COURSE_KEY), 10);
    return enrolledMats().some(m => m.cursoId === id) ? (COURSES.find(c => c.id === id) || null) : null;
  }
  // Curso concluido (matrícula finalizada) = solo lectura
  function isReadOnly() {
    const id = parseInt(sessionStorage.getItem(ACTIVE_COURSE_KEY), 10);
    const m = enrolledMats().find(x => x.cursoId === id);
    return !!m && m.estado === 'finalizada';
  }

  function renderCursosView(entregas) {
    pageTitle.innerHTML = 'Mis <span>cursos</span>';
    pageSubtitle.textContent = 'Elige el curso al que quieres entrar. También puedes revisar tus cursos concluidos.';
    const items = enrolledMats()
      .map(m => ({ m, c: COURSES.find(c => c.id === m.cursoId) }))
      .filter(x => x.c);

    const card = ({ m, c }) => {
      const total = c.sesiones.length;
      const concl = m.estado === 'finalizada';
      const hechas = concl ? total : c.sesiones.filter(s => entregas[s.id]).length;
      const pct = total ? Math.round((hechas / total) * 100) : 0;
      return `
        <button type="button" class="est-course-card${concl ? ' est-course-card--concluido' : ''}" data-curso="${c.id}">
          <div class="est-course-card__top">
            <span class="est-course-card__code">${esc(c.codigo)}</span>
            <span class="pill ${concl ? 'green' : 'neutral'}">${concl ? 'Concluido' : esc(c.modalidad)}</span>
          </div>
          <h3 class="est-course-card__title">${esc(c.nombre)}</h3>
          <div class="est-course-card__meta">
            <span class="est-course-card__meta-item">${esc(c.nivel)}</span>
            <span class="est-course-card__meta-item">${esc(c.horario)}</span>
          </div>
          <div class="est-course-card__progress">
            <div class="est-course-card__progress-info"><span>${hechas} de ${total} sesiones</span><strong>${pct}%</strong></div>
            <div class="est-course-card__progress-track"><div class="est-course-card__progress-fill" style="width:${pct}%;"></div></div>
          </div>
          <span class="est-course-card__cta">${concl ? 'Ver curso' : 'Entrar al curso'} →</span>
        </button>`;
    };

    const activos = items.filter(x => x.m.estado !== 'finalizada');
    const concluidos = items.filter(x => x.m.estado === 'finalizada');
    const grupos = [...new Set(activos.map(x => x.c.instrumento))].sort((a, b) => {
      const ia = INSTRUMENT_ORDER.indexOf(a), ib = INSTRUMENT_ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });

    let html = '<section class="est-courses-section"><h2 class="est-section-label">En curso</h2>';
    if (!activos.length) {
      html += `<div class="est-empty-courses">${items.length ? 'No tienes cursos en progreso.' : 'Aún no estás matriculado en ningún curso.'}</div>`;
    }
    grupos.forEach(g => {
      const lista = activos.filter(x => x.c.instrumento === g);
      html += `<h3 class="est-group-title">${esc(g)} <span class="est-group-count">· ${lista.length} ${lista.length === 1 ? 'curso' : 'cursos'}</span></h3>
               <div class="est-courses-grid">${lista.map(card).join('')}</div>`;
    });
    html += '</section><section class="est-courses-section"><h2 class="est-section-label">Concluidos</h2>';
    html += concluidos.length
      ? `<div class="est-courses-grid" style="margin-top:12px;">${concluidos.map(card).join('')}</div>`
      : '<div class="est-empty-courses">Aún no tienes cursos concluidos.</div>';
    html += '</section>';

    appContent.innerHTML = html;
    appContent.querySelectorAll('[data-curso]').forEach(b => {
      b.addEventListener('click', () => {
        sessionStorage.setItem(ACTIVE_COURSE_KEY, b.getAttribute('data-curso'));
        window.location.hash = '#/sesiones';
      });
    });
  }

    const raw = window.location.hash.replace(/^#\/?/, '');

    return {

      param2: parts[2] || null
    };
  }

    if (route === 'cursos') {
      if (courseProgressWrap) courseProgressWrap.style.display = 'none';
      if (headActions) headActions.style.display = 'none';
      renderCursosView(entregas);
      return;
    }
    if (headActions) headActions.style.display = '';

    // Sesión/tarea de un curso donde NO está matriculado -> sin autorización (RF035 CA02).
    // Si es de otro curso propio, se cambia automáticamente a ese curso.
    if ((route === 'sesion' || route === 'tarea') && param1) {
      const sId = parseInt(param1, 10);
      const owner = COURSES.find(c => c.sesiones.some(s => s.id === sId));
      const enrolled = !!owner && enrolledMats().some(m => m.cursoId === owner.id);
      if (!enrolled) {
        if (courseProgressWrap) courseProgressWrap.style.display = 'none';
        renderUnauthorizedPanel();
        return;
      }
      sessionStorage.setItem(ACTIVE_COURSE_KEY, String(owner.id));
    }

    const userCourse = getActiveCourse();
    if (!userCourse) { window.location.hash = '#/cursos'; return; }
    const sessionStates = calculateSessionStates(userCourse, entregas);

    // Sincronizar navegación y chip del curso activo
    navSesiones.classList.toggle('is-active', route === 'sesiones' || route === 'sesion');
    navTareas.classList.toggle('is-active', route === 'tareas' || route === 'tarea');
    const chipTxt = document.getElementById('estCourseChipText');
    if (chipTxt) chipTxt.textContent = `${userCourse.codigo} · ${userCourse.nombre}${isReadOnly() ? ' · Concluido' : ''}`;

    if (courseProgressWrap) {
      courseProgressWrap.style.display = 'flex';
      updateCourseProgress();
    }

    if (route === 'sesiones' || route === 'sesion') {
      renderSesionesView(userCourse, sessionStates, param1 ? parseInt(param1, 10) : null);
    } else if (route === 'tareas' || (route === 'tarea' && param2 !== 'detalle')) {
      renderTareasView(userCourse, sessionStates, entregas, param1 ? parseInt(param1, 10) : null);
    } else if (route === 'tarea' && param2 === 'detalle') {
      renderDetalleEntregaView(userCourse, entregas, parseInt(param1, 10));
    } else {
      window.location.hash = '#/sesiones';
    }
  }

  // ===================================================================
  // 7. PANTALLA: SESIONES (RF035, RF036, RF037, RF038)

  function renderSesionesView(course, sessionStates, selectedId) {
    pageTitle.innerHTML = 'Mis <span>Sesiones</span>';
    pageSubtitle.textContent = 'Explora el temario ordenado, visualiza lecciones y descarga tus materiales de estudio.';

    let activeSession = course.sesiones.find(s => s.id === selectedId);

      // Buscar primera en proceso o completada

    }

    const activeState = sessionStates[activeSession.id];

    // Columna Izquierda: Lista de sesiones 1 a 6

      const state = sessionStates[s.id];
      const isSelected = s.id === activeSession.id;

      let badgeText = state;

      if (state === 'Completada') {
        badgeClass = 'green';
        icon = '<svg class="i" style="width:14px;height:14px;"><use href="#i-check"/></svg>';
      } else if (state === 'En proceso') {
        badgeClass = 'blue';
      } else if (state === 'Bloqueada') {
        badgeClass = 'neutral';
        icon = '<svg class="i" style="width:14px;height:14px;"><use href="#i-lock"/></svg>';
      }

      return `
        <button type="button" class="est-item-card ${isSelected ? 'is-active' : ''} ${state === 'Bloqueada' ? 'is-locked' : ''}" data-session-id="${s.id}">
          <div class="est-item-card__badge">${s.numero}</div>
          <div class="est-item-card__info">
            <div class="est-item-card__top">
              <span class="est-item-card__num">Sesión ${s.numero}</span>
              <span class="pill ${badgeClass}">${icon} ${esc(badgeText)}</span>
            </div>
            <strong class="est-item-card__title">${esc(s.titulo)}</strong>
          </div>
        </button>
      `;
    }).join('');

    // Columna Derecha: Detalle de la sesión elegida
    let detailHtml = '';
    if (activeState === 'Bloqueada') {
      detailHtml = `
        <div class="est-state-panel">
          <div class="est-state-icon lock">
            <svg class="i" style="width:32px;height:32px;"><use href="#i-lock"/></svg>
          </div>
          <h3>Sesión ${activeSession.numero}: ${esc(activeSession.titulo)}</h3>
          <p>Debes completar la sesión anterior para acceder a esta. Entrega la tarea pendiente para desbloquear el contenido y materiales.</p>
          <a href="#/sesiones" class="btn btn--outline" id="estGoPrevSessionBtn">
            <svg class="i"><use href="#i-left"/></svg> Ver sesiones disponibles
          </a>
        </div>
      `;
    } else {
      // Lecciones de la sesión
      const totalLecciones = (activeSession.lecciones || []).length;
      const lessonsHtml = totalLecciones ? activeSession.lecciones.map((mat, idx) => {
        const numStr = String(idx + 1).padStart(3, '0');
        const isVideo = mat.tipo.includes('Video');

        let pillClass = 'red';
        let iconType = 'video';
        let iconSymbol = '#i-video';

        if (mat.tipo.includes('PDF')) {
          pillClass = 'blue';
          iconType = 'pdf';
          iconSymbol = '#i-file';
        } else if (mat.tipo.includes('Partitura')) {
          pillClass = 'gold';
          iconType = 'partitura';
          iconSymbol = '#i-book';
        }

        let mediaResourceHtml = '';
        if (isVideo) {
          mediaResourceHtml = `
            <div class="est-video-player est-btn-preview" data-mat-id="${mat.id}" role="button" tabindex="0" aria-label="Reproducir video: ${esc(mat.titulo)}">
              ${mat.archivoUrl ? `
                <video preload="metadata" muted playsinline src="${esc(mat.archivoUrl)}#t=0.5" class="est-video-player__media" onerror="this.style.display='none';"></video>
              ` : ''}
              <div class="est-video-player__scrim"></div>
              <div class="est-video-player__play">
                <svg class="est-video-player__play-tri" viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg>
              </div>
              <div class="est-video-player__timeline">
                <div class="est-video-player__timeline-bar"></div>
              </div>
              <span class="est-video-player__duration">${esc(mat.duracion || 'Video HD')}</span>
            </div>
          `;
        } else {
          mediaResourceHtml = `
            <div class="est-lesson-doc-thumb est-btn-preview" data-mat-id="${mat.id}" role="button" tabindex="0" aria-label="Ver documento: ${esc(mat.titulo)}">
              <div class="est-mat-icon ${iconType}">
                <svg class="i" style="width:24px;height:24px;"><use href="${iconSymbol}"/></svg>
              </div>
              <span class="pill ${pillClass}" style="font-size:11px;">${esc(mat.tipo)}</span>
            </div>
          `;
        }

        return `
          <div class="est-lesson-card">
            <div class="est-lesson-card__head">
              <span class="est-lesson-card__num">Lección ${numStr}</span>
              <div class="est-lesson-card__meta">
                <span class="pill ${pillClass}">${esc(mat.tipo)}</span>
                ${isVideo && mat.duracion ? `<span class="est-lesson-card__dur">${esc(mat.duracion)}</span>` : ''}
              </div>
            </div>
            <div class="est-lesson-card__body">
              <div class="est-lesson-card__media">
                ${mediaResourceHtml}
              </div>
              <div class="est-lesson-card__content">
                <div class="est-lesson-field">
                  <span class="est-lesson-label">Título de la lección</span>
                  <strong class="est-lesson-title">${esc(mat.titulo)}</strong>

                  <span class="est-lesson-label">Descripción</span>
                  <p class="est-lesson-desc">${esc(mat.desc)}</p>
                </div>
                <div class="est-lesson-file">
                  <svg class="i" style="width:14px;height:14px;"><use href="#i-file"/></svg>
                  <span>${esc(mat.ref)}</span>
                </div>
                <div class="est-mat-actions">
                  <button type="button" class="btn btn--outline btn--sm est-btn-preview" data-mat-id="${mat.id}">
                    <svg class="i"><use href="#i-eye"/></svg> Ver
                  </button>
                  <button type="button" class="btn btn--primary btn--sm est-btn-download" data-mat-ref="${esc(mat.ref)}" data-mat-title="${esc(mat.titulo)}">
                    <svg class="i"><use href="#i-download"/></svg> Descargar
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('') : `<p class="muted">Esta sesión aún no tiene lecciones publicadas.</p>`;

      detailHtml = `
        <div class="est-detail-hero">
          <div class="est-detail-hero__main">
            <span class="pill ${activeState === 'Completada' ? 'green' : 'blue'}">
              ${activeState === 'Completada' ? '✔ Sesión completada' : 'En proceso'}
            </span>
            <h2>Sesión ${activeSession.numero}: ${esc(activeSession.titulo)}</h2>
            <div class="est-detail-hero__meta">
              <span>📅 Publicada: ${esc(activeSession.fecha)}</span>
              <span>•</span>
              <span>Docente: ${esc(course.docente)}</span>
              <span>•</span>
              <span>${totalLecciones} lección(es)</span>
            </div>
          </div>
          <div>
            <a href="#/tarea/${activeSession.id}" class="btn btn--primary">
              <span>Ir a la tarea de esta sesión</span>
              <svg class="i"><use href="#i-right"/></svg>
            </a>
          </div>
        </div>

        <div class="est-detail-body">
          <div class="est-section-title">
            <span>Lecciones de la sesión</span>
            <small class="muted" style="font-weight:normal;font-size:12.5px;">${totalLecciones} ${totalLecciones === 1 ? 'lección' : 'lecciones'}</small>

          </div>
        </div>
      `;
    }

    appContent.innerHTML = `
      <div class="est-master-detail">
        <aside class="est-side-list" aria-label="Lista de sesiones del curso">
          <div class="est-side-list__head">
            <h2>Sesiones del curso</h2>
            <p>${course.codigo} · ${course.nombre}</p>
          </div>
          ${listHtml}
        </aside>

        <section class="est-detail-panel" aria-label="Detalle de sesión">
          ${detailHtml}
        </section>
      </div>
    `;

    // Eventos de selección de sesión
    appContent.querySelectorAll('.est-item-card').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-session-id');
        window.location.hash = `#/sesion/${id}`;
      });
    });

    // Eventos de previsualización y descarga
    appContent.querySelectorAll('.est-btn-preview').forEach(btn => {
      const openFn = () => {
        const matId = parseInt(btn.getAttribute('data-mat-id'), 10);
        const mat = activeSession.lecciones.find(m => m.id === matId);
        if (mat) openMaterialPreview(mat);
      };
      btn.addEventListener('click', openFn);
      btn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openFn();
        }
      });
    });

    appContent.querySelectorAll('.est-btn-download').forEach(btn => {
      btn.addEventListener('click', () => {
        const rawRef = btn.getAttribute('data-mat-ref');
        const title = btn.getAttribute('data-mat-title');
        const filename = rawRef.split('·')[0].trim();
        triggerRealDownload(filename, `Recurso: ${title}\nDescargado desde Dunamys.`);
      });
    });
  }

  // ===================================================================
  // 8. PANTALLA: TAREAS (RF039, RF040, RF041)
  // ===================================================================
  function renderTareasView(course, sessionStates, entregas, selectedId) {
    pageTitle.innerHTML = 'Mis <span>Tareas</span>';
    pageSubtitle.textContent = 'Entrega tus evidencias de práctica, consulta el estado de revisión y retroalimentación.';

    // Determinar tarea/sesión activa
    let activeSession = course.sesiones.find(s => s.id === selectedId);
    if (!activeSession) {
      // Buscar primera por entregar o la primera sesión disponible
      activeSession = course.sesiones.find(s => sessionStates[s.id] === 'En proceso') || course.sesiones[0];
    }

    const sState = sessionStates[activeSession.id];
    const entrega = entregas[activeSession.id] || null;

    // Columna Izquierda: Lista de tareas
    const listHtml = course.sesiones.map(s => {
      const state = sessionStates[s.id];
      const e = entregas[s.id];
      const isSelected = s.id === activeSession.id;

      let estadoTarea = 'Por entregar';
      let icon = '<svg class="i" style="width:14px;height:14px;"><use href="#i-clock"/></svg>';
      let pillClass = 'neutral';

      if (state === 'Bloqueada') {
        estadoTarea = 'Bloqueada';
        icon = '<svg class="i" style="width:14px;height:14px;"><use href="#i-lock"/></svg>';
        pillClass = 'neutral';
      } else if (e) {
        estadoTarea = e.estado; // 'Aprobada', 'Observada', 'Pendiente'
        if (e.estado === 'Aprobada') {
          icon = '<svg class="i" style="width:14px;height:14px;"><use href="#i-check"/></svg>';
          pillClass = 'green';
        } else if (e.estado === 'Observada') {
          icon = '<svg class="i" style="width:14px;height:14px;"><use href="#i-alert"/></svg>';
          pillClass = 'red';
        } else if (e.estado === 'Pendiente') {
          icon = '<svg class="i" style="width:14px;height:14px;"><use href="#i-clock"/></svg>';
          pillClass = 'gold';
        }
      }

      return `
        <button type="button" class="est-item-card ${isSelected ? 'is-active' : ''} ${state === 'Bloqueada' ? 'is-locked' : ''}" data-task-id="${s.id}">
          <div class="est-item-card__badge">${s.numero}</div>

            <div class="est-item-card__top">
              <span class="est-item-card__num">Tarea Sesión ${s.numero}</span>

            <strong class="est-item-card__title">${esc(s.tarea.titulo)}</strong>

        </button>
      `;

    // Columna Derecha: Detalle de la tarea y zona de entrega
    const t = activeSession.tarea;
    const taskVideoObj = t ? (t.videoDocente || t.video || (t.archivoUrl ? { archivoUrl: t.archivoUrl } : null)) : null;

    if (sState === 'Bloqueada') {

            <svg class="i" style="width:32px;height:32px;"><use href="#i-lock"/></svg>

          <p>Para desbloquear esta tarea, primero debes entregar y completar la sesión anterior.</p>
        </div>
      `;
    } else {
      const isDelivered = !!entrega && (entrega.estado !== 'Observada' || isReadOnly());
